<svg viewBox="0 0 854 170" xmlns="http://www.w3.org/2000/svg" width="854" height="170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="60%" stop-color="#0B0F18"/>
      <stop offset="100%" stop-color="#0E1520"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feComponentTransfer in="blur" result="cb">
        <feFuncR type="linear" slope="0"/>
        <feFuncG type="linear" slope="0.83"/>
        <feFuncB type="linear" slope="1"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#00D4FF" opacity="0.06"/>
    </pattern>
    <style>
      .sub { opacity: 0; }
      .s1  { animation: cyc 18s infinite 0s; }
      .s2  { animation: cyc 18s infinite 3s; }
      .s3  { animation: cyc 18s infinite 6s; }
      .s4  { animation: cyc 18s infinite 9s; }
      .s5  { animation: cyc 18s infinite 12s; }
      .s6  { animation: cyc 18s infinite 15s; }
      @keyframes cyc {
        0%,2%,19%,100% { opacity:0; }
        5%,16%          { opacity:1; }
      }
      .cur    { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .livdot { animation: pdot 2.4s ease-in-out infinite; }
      @keyframes pdot {
        0%,100% { opacity:.6; }
        50%     { opacity:1; }
      }
      .dec { animation: dfade 5s ease-in-out infinite alternate; }
      @keyframes dfade {
        0%   { opacity:.04; }
        100% { opacity:.09; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="854" height="170" fill="url(#bg)"/>
  <rect width="854" height="170" fill="url(#dots)"/>

  <!-- Decorative right-side code (faint) -->
  <g class="dec" font-family="'Courier New',Courier,monospace" font-size="11" fill="#00D4FF" text-anchor="end">
    <text x="840" y="36">0xC0DE0000</text>
    <text x="840" y="52">0x7FFE4B2A</text>
    <text x="840" y="68">0xDEADBEEF</text>
    <text x="840" y="84">kernel32.dll</text>
    <text x="840" y="100">ntdll.dll</text>
    <text x="840" y="116">0x00401000</text>
    <text x="840" y="132">jmp [rax+0x18]</text>
    <text x="840" y="148">ret</text>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="170" fill="#00D4FF" opacity="0.65" filter="url(#cyanglow)"/>

  <!-- Borders -->
  <line x1="3" y1="0.5"   x2="854" y2="0.5"   stroke="#1C2330" stroke-width="1"/>
  <line x1="3" y1="169.5" x2="854" y2="169.5" stroke="#1C2330" stroke-width="1"/>

  <!-- // prefix -->
  <text x="32" y="68" font-family="'Courier New',Courier,monospace" font-size="44" font-weight="bold" fill="#253040">//</text>

  <!-- Name -->
  <text x="90" y="68" font-family="'Courier New',Courier,monospace" font-size="44" font-weight="bold" fill="#E2EAF4" filter="url(#glow)">dxkku</text>

  <!-- Prompt arrow -->
  <text x="32" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#2A3A4E">&#x276F;</text>

  <!-- Cycling subtitle — each on the same position, only one visible at a time -->
  <text class="sub s1" x="50" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#00D4FF" filter="url(#cyanglow)">Systems Engineer</text>
  <text class="sub s2" x="50" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#00D4FF" filter="url(#cyanglow)">Low-Level Development</text>
  <text class="sub s3" x="50" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#00D4FF" filter="url(#cyanglow)">Memory Manipulation</text>
  <text class="sub s4" x="50" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#00D4FF" filter="url(#cyanglow)">Backend Infrastructure</text>
  <text class="sub s5" x="50" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#00D4FF" filter="url(#cyanglow)">Kernel Driver Dev</text>
  <text class="sub s6" x="50" y="104" font-family="'Courier New',Courier,monospace" font-size="13" fill="#00D4FF" filter="url(#cyanglow)">Game Infrastructure</text>

  <!-- Blinking cursor -->
  <rect class="cur" x="50" y="89" width="8" height="16" fill="#00D4FF" rx="1" opacity="0.85"/>

  <!-- Divider -->
  <line x1="32" y1="122" x2="440" y2="122" stroke="#1C2330" stroke-width="1"/>

  <!-- Status -->
  <circle class="livdot" cx="32" cy="145" r="4" fill="#00FF88"/>
  <text x="44" y="149" font-family="'Courier New',Courier,monospace" font-size="11" fill="#3A5060" letter-spacing="0.05em">session active · discord @7.2u</text>
</svg>
